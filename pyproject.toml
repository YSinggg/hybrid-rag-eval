[project]
name = "hybrid-rag-eval"
version = "0.1.0"
description = "Evaluated Hybrid-RAG (BM25 + Vector + RRF) document Q&A service with FastAPI, Gemini API support, and automated retrieval/grounding evals."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.1",
    "google-genai>=2.30.1",
    "numpy>=2.5.5",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
